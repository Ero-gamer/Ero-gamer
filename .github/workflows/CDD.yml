name: Commits dd

on:
  workflow_dispatch:
    inputs:
      commit_ref:
        description: 'Commit SHA (e.g. 9ef7077) OR Range (e.g. 497b7e4..9ef7077)'
        required: true
        type: string
      include_deleted_log:
        description: 'Include deleted-files.txt inside the ZIP?'
        required: false
        default: true
        type: boolean

jobs:
  package-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input and fetch commits from Kotatsu-Redo
        id: fetch
        shell: bash
        run: |
          set -euo pipefail

          # Trim whitespace from user input
          RAW_INPUT=$(echo "${{ inputs.commit_ref }}" | xargs)

          if [[ -z "$RAW_INPUT" ]]; then
            echo "::error::Commit SHA or range cannot be empty."
            exit 1
          fi

          # Validate allowed characters (hex hashes and optional '..' range separator)
          if [[ ! "$RAW_INPUT" =~ ^[0-9a-fA-F]{4,40}(\.\.[0-9a-fA-F]{4,40})?$ ]]; then
            echo "::error::Invalid format '$RAW_INPUT'. Enter a single commit hash (e.g. 9ef7077) or a range (e.g. 497b7e4..9ef7077)."
            exit 1
          fi

          git init target-repo
          cd target-repo
          git remote add origin "https://github.com"

          if [[ "$RAW_INPUT" == *".."* ]]; then
            START_REF="${RAW_INPUT%%..*}"
            END_REF="${RAW_INPUT##*..}"

            echo "Fetching commit range: $START_REF .. $END_REF"
            if ! git fetch --depth=50 origin "$START_REF" "$END_REF" 2>/dev/null; then
              echo "::error::Could not fetch one or both commits in '$RAW_INPUT'. Verify that both hashes exist in Kotatsu-Redo/Kotatsu-Redo."
              exit 1
            fi

            # Deepen history if merge-base is not yet present
            if ! git merge-base "$START_REF" "$END_REF" >/dev/null 2>&1; then
              echo "Deepening commit history to resolve range..."
              git fetch --deepen=250 origin "$START_REF" "$END_REF" || git fetch --unshallow origin
            fi

            START_FULL=$(git rev-parse "$START_REF")
            END_FULL=$(git rev-parse "$END_REF")
            SHORT_LABEL="$(git rev-parse --short=7 "$START_FULL")-to-$(git rev-parse --short=7 "$END_FULL")"

            echo "MODE=range" >> "$GITHUB_OUTPUT"
            echo "START_SHA=$START_FULL" >> "$GITHUB_OUTPUT"
            echo "END_SHA=$END_FULL" >> "$GITHUB_OUTPUT"
            echo "LABEL=$SHORT_LABEL" >> "$GITHUB_OUTPUT"
          else
            echo "Fetching single commit: $RAW_INPUT"
            if ! git fetch --depth=2 origin "$RAW_INPUT" 2>/dev/null; then
              echo "::error::Commit '$RAW_INPUT' was not found in Kotatsu-Redo/Kotatsu-Redo. Double-check the SHA and try again."
              exit 1
            fi

            END_FULL=$(git rev-parse FETCH_HEAD)
            SHORT_LABEL=$(git rev-parse --short=7 "$END_FULL")

            echo "MODE=single" >> "$GITHUB_OUTPUT"
            echo "START_SHA=" >> "$GITHUB_OUTPUT"
            echo "END_SHA=$END_FULL" >> "$GITHUB_OUTPUT"
            echo "LABEL=$SHORT_LABEL" >> "$GITHUB_OUTPUT"
          fi

      - name: Package changed files and optional deleted log into ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd target-repo

          MODE="${{ steps.fetch.outputs.MODE }}"
          START_SHA="${{ steps.fetch.outputs.START_SHA }}"
          END_SHA="${{ steps.fetch.outputs.END_SHA }}"
          LABEL="${{ steps.fetch.outputs.LABEL }}"
          ZIP_PATH="../Kotatsu-Redo-${LABEL}-changed.zip"

          if [[ "$MODE" == "range" ]]; then
            git diff --name-only --diff-filter=ACMRT -z "$START_SHA" "$END_SHA" > ../changed.list
            git diff --name-only --diff-filter=D "$START_SHA" "$END_SHA" > ../deleted.txt
          else
            # Handles both standard commits and initial root commits cleanly
            git diff-tree --root --no-commit-id --name-only --diff-filter=ACMRT -r -z "$END_SHA" > ../changed.list
            git diff-tree --root --no-commit-id --name-only --diff-filter=D -r "$END_SHA" > ../deleted.txt
          fi

          CHANGED_COUNT=$(tr -cd '\0' < ../changed.list | wc -c | xargs)
          DELETED_COUNT=$(wc -l < ../deleted.txt | xargs)

          echo "Found $CHANGED_COUNT added/modified file(s) and $DELETED_COUNT deleted file(s)."

          if [[ "$CHANGED_COUNT" -eq 0 && "$DELETED_COUNT" -eq 0 ]]; then
            echo "::error::No file changes were detected for '${{ inputs.commit_ref }}'. If you entered a range, ensure the older commit is listed first (old..new)."
            exit 1
          fi

          if [[ "$CHANGED_COUNT" -gt 0 ]]; then
            # Use a temporary staging directory so zip works reliably regardless of file count
            mkdir -p ../stage
            xargs -0 -a ../changed.list git archive --format=tar "$END_SHA" -- | tar -x -C ../stage
          else
            echo "::warning::This commit only deleted files; no modified or added files exist to archive."
            mkdir -p ../stage
          fi

          if [[ "${{ inputs.include_deleted_log }}" == "true" ]]; then
            if [[ "$DELETED_COUNT" -gt 0 ]]; then
              {
                echo "Deleted files in Kotatsu-Redo (${{ inputs.commit_ref }}):"
                echo "----------------------------------------------------"
                cat ../deleted.txt
              } > ../stage/deleted-files.txt
            else
              echo "No files were deleted in Kotatsu-Redo (${{ inputs.commit_ref }})." > ../stage/deleted-files.txt
            fi
          fi

          if [[ -z "$(ls -A ../stage)" ]]; then
            echo "::error::Nothing to package into ZIP (0 changed files and deleted-files.txt disabled)."
            exit 1
          fi

          (cd ../stage && zip -rq "$ZIP_PATH" .)
          echo "ZIP_NAME=Kotatsu-Redo-${LABEL}-changed" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ZIP_NAME }}
          path: Kotatsu-Redo-*-changed.zip
          if-no-files-found: error
          retention-days: 14

      - name: Error Summary on Failure
        if: failure()
        shell: bash
        run: |
          echo "### Packaging Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Could not generate ZIP for input: \`${{ inputs.commit_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ensure the commit hash exists in **Kotatsu-Redo/Kotatsu-Redo**." >> "$GITHUB_STEP_SUMMARY"
          echo "- For ranges, use \`older_sha..newer_sha\` (for example: \`497b7e4..9ef7077\`)." >> "$GITHUB_STEP_SUMMARY"
