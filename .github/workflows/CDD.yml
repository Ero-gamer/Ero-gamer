name: Commits dd

on:
  workflow_dispatch:
    inputs:
      commit_ref:
        description: 'Commit SHA (e.g. 9ef7077) OR Range (e.g. 497b7e4..9ef7077)'
        required: true
        type: string
      include_deleted_log:
        description: 'Include deleted-files.txt inside the ZIP?'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  package-commit:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: Kotatsu-Redo/Kotatsu-Redo

    steps:
      - name: Validate input and fetch commits
        id: fetch
        shell: bash
        env:
          COMMIT_REF: ${{ inputs.commit_ref }}
        run: |
          set -euo pipefail

          raw_input="$COMMIT_REF"
          raw_input="${raw_input#"${raw_input%%[![:space:]]*}"}"
          raw_input="${raw_input%"${raw_input##*[![:space:]]}"}"

          if [[ -z "$raw_input" ]]; then
            echo "::error::Commit SHA or range cannot be empty."
            exit 1
          fi

          if [[ ! "$raw_input" =~ ^[0-9a-fA-F]{4,40}(\.\.[0-9a-fA-F]{4,40})?$ ]]; then
            echo "::error::Invalid format. Enter a commit hash (e.g. 9ef7077) or range (e.g. 497b7e4..9ef7077)."
            exit 1
          fi

          git init --quiet target-repo
          cd target-repo
          git remote add origin "https://github.com/${TARGET_REPOSITORY}.git"

          fetch_commit() {
            local input="$1"
            local destination="$2"

            if ! git fetch --no-tags --depth=1 origin "$input"; then
              echo "::error::Could not fetch commit '$input' from ${TARGET_REPOSITORY}. Check that the SHA exists and is accessible."
              return 1
            fi

            local full_sha
            if ! full_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"; then
              echo "::error::Fetch did not resolve '$input' to a commit."
              return 1
            fi

            git update-ref "$destination" "$full_sha"
          }

          if [[ "$raw_input" == *".."* ]]; then
            start_ref="${raw_input%%..*}"
            end_ref="${raw_input##*..}"

            echo "Fetching commit range: ${start_ref} .. ${end_ref}"
            fetch_commit "$start_ref" refs/cdd/start
            fetch_commit "$end_ref" refs/cdd/end

            start_sha="$(git rev-parse refs/cdd/start)"
            end_sha="$(git rev-parse refs/cdd/end)"
            label="$(git rev-parse --short=7 "$start_sha")-to-$(git rev-parse --short=7 "$end_sha")"
            mode=range
          else
            echo "Fetching single commit: $raw_input"
            fetch_commit "$raw_input" refs/cdd/end

            start_sha=""
            end_sha="$(git rev-parse refs/cdd/end)"
            label="$(git rev-parse --short=7 "$end_sha")"
            mode=single
          fi

          {
            echo "MODE=$mode"
            echo "START_SHA=$start_sha"
            echo "END_SHA=$end_sha"
            echo "LABEL=$label"
          } >> "$GITHUB_OUTPUT"

      - name: Package changed files and optional deleted log into ZIP
        id: package
        shell: bash
        env:
          COMMIT_REF: ${{ inputs.commit_ref }}
          INCLUDE_DELETED_LOG: ${{ inputs.include_deleted_log }}
          MODE: ${{ steps.fetch.outputs.MODE }}
          START_SHA: ${{ steps.fetch.outputs.START_SHA }}
          END_SHA: ${{ steps.fetch.outputs.END_SHA }}
          LABEL: ${{ steps.fetch.outputs.LABEL }}
        run: |
          set -euo pipefail
          cd target-repo

          zip_path="../Kotatsu-Redo-${LABEL}-changed.zip"
          changed_list=../changed.list
          deleted_list=../deleted.txt

          if [[ "$MODE" == "range" ]]; then
            git diff --name-only --diff-filter=ACMRT -z "$START_SHA" "$END_SHA" -- > "$changed_list"
            git diff --name-only --diff-filter=D "$START_SHA" "$END_SHA" -- > "$deleted_list"
          else
            git diff-tree --root --no-commit-id --name-only --diff-filter=ACMRT -r -z "$END_SHA" -- > "$changed_list"
            git diff-tree --root --no-commit-id --name-only --diff-filter=D -r "$END_SHA" -- > "$deleted_list"
          fi

          changed_count="$(tr -cd '\0' < "$changed_list" | wc -c | xargs)"
          deleted_count="$(wc -l < "$deleted_list" | xargs)"
          echo "Found $changed_count added/modified file(s) and $deleted_count deleted file(s)."

          if [[ "$changed_count" -eq 0 && "$deleted_count" -eq 0 ]]; then
            echo "::error::No file changes were detected for '$COMMIT_REF'. For a range, provide older_sha..newer_sha."
            exit 1
          fi

          mkdir -p ../stage
          if [[ "$changed_count" -gt 0 ]]; then
            # NUL-delimited paths safely handle spaces and other special characters.
            xargs -0 -r -a "$changed_list" git archive --format=tar "$END_SHA" -- | tar -x -C ../stage
          else
            echo "::warning::This input only deletes files; there are no added or modified files to archive."
          fi

          if [[ "$INCLUDE_DELETED_LOG" == "true" ]]; then
            if [[ "$deleted_count" -gt 0 ]]; then
              {
                echo "Deleted files in Kotatsu-Redo ($COMMIT_REF):"
                echo "----------------------------------------------------"
                cat "$deleted_list"
              } > ../stage/deleted-files.txt
            else
              echo "No files were deleted in Kotatsu-Redo ($COMMIT_REF)." > ../stage/deleted-files.txt
            fi
          fi

          if [[ -z "$(ls -A ../stage)" ]]; then
            echo "::error::Nothing to package (no changed files and deleted-files.txt is disabled)."
            exit 1
          fi

          (cd ../stage && zip -rq "$zip_path" .)
          echo "ZIP_NAME=Kotatsu-Redo-${LABEL}-changed" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.ZIP_NAME }}
          path: Kotatsu-Redo-*-changed.zip
          if-no-files-found: error
          retention-days: 14

      - name: Error Summary on Failure
        if: failure()
        shell: bash
        env:
          COMMIT_REF: ${{ inputs.commit_ref }}
        run: |
          {
            printf '%s\n' '### Packaging Failed'
            printf 'Could not generate ZIP for input: `%s`\n' "$COMMIT_REF"
            printf '%s\n' '- Verify the commit hash exists and is accessible in **Kotatsu-Redo/Kotatsu-Redo**.'
            printf '%s\n' '- For ranges, use `older_sha..newer_sha` (for example: `497b7e4..9ef7077`).'
          } >> "$GITHUB_STEP_SUMMARY"
